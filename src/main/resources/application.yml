spring:
  application:
    name: villain-lair-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/villain_lair}
    username: ${SPRING_DATASOURCE_USERNAME:villain}
    password: ${SPRING_DATASOURCE_PASSWORD:villain}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: villain-lair-consumers
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "kz.railan.villain_lair_api.event"
        spring.json.use.type.headers: true

server:
  port: 8080

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-change-me-change-me-change-me-32bytes}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
