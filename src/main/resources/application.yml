spring:
  application:
    name: villain-lair-api
  datasource:
    url: jdbc:postgresql://localhost:5432/villain_lair
    username: villain
    password: villain
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8080

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-change-me-change-me-change-me-32bytes}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
